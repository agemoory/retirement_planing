name: 시장 지표(코스피·나스닥·환율·금리) 갱신

on:
  schedule:
    # 평일 매시 정각 근처(UTC). 한국장(00~07 UTC)·미국장(13~21 UTC)을 모두 덮음
    - cron: "23 * * * 1-5"
    # 토요일 아침(한국 시간) 한 번 더 — 금요일 미국장 마감 반영
    - cron: "23 0 * * 6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market.yml"
      - ".github/scripts/market_feed.py"

permissions:
  contents: write

concurrency:
  group: market-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 시세 받기
        run: python3 .github/scripts/market_feed.py
      - name: 숫자가 바뀌었으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          # 갱신 시각만 바뀐 경우는 저장하지 않음 (커밋 줄이기)
          if git diff --cached --quiet || [ "$(git diff --cached -U0 data/market.json | grep '^[+-] ' | grep -v '"updated"' | wc -l)" = "0" ]; then
            echo "변경 없음"
          else
            git commit -m "시장 지표 갱신"
            git pull --rebase -q || true
            git push
          fi
