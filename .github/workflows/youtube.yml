name: 유튜브 최신 영상 목록 갱신

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube.yml"
      - ".github/scripts/youtube_feed.py"

permissions:
  contents: write

concurrency:
  group: youtube-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 채널 RSS에서 영상 목록 받기
        run: python3 .github/scripts/youtube_feed.py
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "유튜브 최신 영상 목록 갱신"
            git push
          fi
