name: 시장 지표(코스피·나스닥·환율·금리) 갱신

# 결과는 main이 아니라 별도 브랜치 market-data에 market.json 한 파일로 덮어씀
# → main 기록이 지저분해지지 않고, 홈페이지 재배포도 일어나지 않음
# 홈페이지는 raw.githubusercontent.com/.../market-data/market.json을 읽음

on:
  schedule:
    # GitHub 예약 실행은 자주 건너뛰므로 촘촘하게 걸어둠 (평일, UTC)
    - cron: "*/10 * * * 1-5"
    # 토요일 아침(한국 시간) — 금요일 미국장 마감 반영
    - cron: "7 0,1,2 * * 6"
  # 외부 스케줄러(cron-job.org 등)나 수동 실행용
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market.yml"
      - ".github/scripts/market_feed.py"

permissions:
  contents: write

concurrency:
  group: market-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 이전 값 가져오기
        run: |
          mkdir -p data
          if git fetch -q --depth=1 origin market-data 2>/dev/null; then
            git show FETCH_HEAD:market.json > data/market.json 2>/dev/null || true
          fi
          cp data/market.json /tmp/before.json 2>/dev/null || echo '{}' > /tmp/before.json
      - name: 시세 받기
        run: python3 .github/scripts/market_feed.py
      - name: 숫자가 바뀌었으면 market-data 브랜치에 저장
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          strip() { python3 -c "import json,sys;d=json.load(open(sys.argv[1]));d.pop('updated',None);print(json.dumps(d,sort_keys=True))" "$1" 2>/dev/null; }
          if [ "$(strip /tmp/before.json)" = "$(strip data/market.json)" ]; then
            echo "변경 없음"; exit 0
          fi
          mkdir /tmp/pub && cp data/market.json /tmp/pub/market.json && cd /tmp/pub
          git init -q && git checkout -q -b market-data
          git add market.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "시장 지표"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" market-data
          echo "저장함"
